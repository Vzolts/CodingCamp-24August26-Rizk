<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrapper">
  <header class="card header-card">
    <div class="header-top-row">
      <button id="theme-btn" class="theme-btn" aria-label="Toggle theme">Dark Mode</button>
    </div>
    <div id="clock" class="clock">00:00:00</div>
    <div id="date-display" class="date-display">Monday, January 1, 2025</div>
    <div id="greeting-row" class="greeting-row">
      <span id="greeting-text" class="greeting-text">Good Morning!</span>
      <button id="edit-name-btn" class="icon-btn" title="Edit name">&#9998;</button>
    </div>
    <div id="name-edit-row" class="name-edit-row hidden">
      <input id="name-input" type="text" maxlength="50" placeholder="Enter your name..." class="name-input" />
      <button id="save-name-btn" class="btn btn-primary btn-sm">Save</button>
      <button id="cancel-name-btn" class="btn btn-ghost btn-sm">Cancel</button>
    </div>
  </header>
  <main class="main-grid">
    <div class="left-col">
      <section class="card timer-card">
        <h2 class="card-title">Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div id="timer-done" class="timer-done hidden">Session complete! Great work!</div>
        <div class="timer-btns">
          <button id="btn-start" class="btn btn-primary">Start</button>
          <button id="btn-stop"  class="btn btn-primary" disabled>Stop</button>
          <button id="btn-reset" class="btn btn-primary">Reset</button>
        </div>
      </section>
      <section class="card links-card">
        <h2 class="card-title">Quick Links</h2>
        <div class="link-add-row">
          <input id="link-name" type="text" placeholder="Link name" maxlength="100" class="input-sm" />
          <input id="link-url"  type="text" placeholder="URL" class="input-sm" />
          <button id="btn-add-link" class="btn btn-primary">Add Link</button>
        </div>
        <div id="link-error" class="error-msg hidden"></div>
        <div id="links-container" class="links-container">
          <p id="links-empty" class="empty-state">No links yet. Add your favourites!</p>
        </div>
      </section>
    </div>
    <section class="card tasks-card">
      <h2 class="card-title">Tasks</h2>
      <div class="task-add-row">
        <input id="task-input" type="text" maxlength="200" placeholder="Add a new task..." class="task-input" />
        <button id="btn-add-task" class="btn btn-primary">Add</button>
      </div>
      <div id="task-error" class="error-msg hidden"></div>
      <div class="task-meta-row">
        <span id="task-count" class="task-count">0 tasks left</span>
        <select id="sort-select" class="sort-select">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="pending">Pending first</option>
          <option value="az">A - Z</option>
        </select>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <p id="task-empty" class="empty-state">No tasks yet. Add your first task!</p>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
